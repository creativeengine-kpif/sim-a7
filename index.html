<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="App Store">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>App Store</title>
<style>
  /* canvas = IMG_6059 minus the true 14 Pro status bar (59pt = 177px): 1179 x 2379,
     1:1 with the device. Every overlay is placed in % of that canvas. */
  * { -webkit-tap-highlight-color: rgba(0,0,0,0); }
  html, body { margin:0; padding:0; height:100%; background:#fff; overflow:hidden;
               overscroll-behavior:none; }
  #stage { position:fixed; inset:0; background:#fff;
           -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
           touch-action:none; overflow:hidden; }
  #bg { position:absolute; inset:0; width:100%; height:100%; display:block;
        pointer-events:none; }
  /* white patch: covers the baked Get pill AND the In-App Purchases label
     (x 454-834, y 441-548 canvas) from the moment of the tap, forever */
  #patch { position:absolute; left:38.5072%; top:18.5372%; width:32.2307%; height:4.4977%;
           background:#fff; display:none; pointer-events:none; }
  /* Get sprite: the real pill crop (230x104 incl 4px AA margin) at 458,445 */
  #getspr { position:absolute; left:38.8465%; top:18.7053%; width:19.5081%; height:4.3716%;
            pointer-events:none; transform-origin:50% 50%; }
  #getspr img { width:100%; height:100%; display:block; }
  #ov { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  /* morph window: JS drives left/top/width/height in %; clips the Open sprite */
  #morph { position:absolute; overflow:hidden; display:none; pointer-events:none; }
  #morph img { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
               width:230px; height:104px; }
  /* final Open sprite, unclipped real pixels */
  #openfin { position:absolute; left:38.8465%; top:18.7053%; width:19.5081%; height:4.3716%;
             display:none; pointer-events:none; }
  #openfin img { width:100%; height:100%; display:block; }
  #tap { position:absolute; left:37%; top:17.6%; width:23%; height:6.6%;
         touch-action:manipulation; }
  #open { position:absolute; left:37%; top:17.6%; width:23%; height:6.6%;
          display:none; touch-action:manipulation; outline:none;
          -webkit-tap-highlight-color: rgba(0,0,0,0); }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="bg.png" alt="">
  <div id="patch"></div>
  <div id="getspr"><img src="get.png" alt=""></div>
  <svg id="ov" viewBox="0 0 1179 2379" preserveAspectRatio="none"
       xmlns="http://www.w3.org/2000/svg">
    <!-- ring center (510, 496.5), centerline r 39, stroke 7 (V3 2.3pt @3x, measured on the
         real 14 Pro install). Track #E6E4E6, arc #007DFF, bars per V3 (2.45x9.45pt, gap 1.55pt). -->
    <g id="ringg" opacity="0">
      <circle id="track" cx="510" cy="496.5" r="39" fill="none"
              stroke="#E6E4E6" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="193.6 245.04" transform="rotate(-90 510 496.5)"/>
      <circle id="arc" cx="510" cy="496.5" r="39" fill="none"
              stroke="#007DFF" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="0 245.04" transform="rotate(-90 510 496.5)"/>
      <g id="pausebars" opacity="0" fill="#007DFF">
        <rect x="500.32" y="482.32" width="7.35" height="28.35" rx="3.675"/>
        <rect x="512.32" y="482.32" width="7.35" height="28.35" rx="3.675"/>
      </g>
    </g>
  </svg>
  <div id="morph"><img src="open.png" alt=""></div>
  <div id="openfin"><img src="open.png" alt=""></div>
  <div id="tap"></div>
  <a id="open" href="bigolive://livevideoshow?visitor=1" rel="noopener"></a>
  <div id="diag" style="position:absolute;left:0;top:0;width:14%;height:7%;touch-action:manipulation;"></div>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var patch = $('patch'), getspr = $('getspr'), ringg = $('ringg'), track = $('track'),
      arc = $('arc'), bars = $('pausebars'), morph = $('morph'),
      openfin = $('openfin'), tap = $('tap'), openA = $('open');

  var CIRC = 245.04;                       // 2*pi*39
  var CW = 1179, CH = 2379;                // canvas
  var RCX = 510, RCY = 496.5;              // ring center
  var PILL = { x: 462, y: 449, w: 222, h: 96 };

  // ---- BigoSim V3 R30/R32 timeline, ported verbatim (seconds from tap) ----
  var COLLAPSE = 0.18;
  var fillStart = 1.33, smoothEnd = 2.47, jumpEnd = 2.65,
      freezeEnd = 3.946, morphAt = 4.096, MORPH_S = 0.217;
  var plateau = 0.756, sixty = 0.60, spinSpeed = 350.0;
  var spinEnd = fillStart - 0.30;
  var smoothPts = [[0.000, 0.000], [0.158, 0.100], [0.247, 0.169], [0.421, 0.267],
                   [0.553, 0.339], [0.684, 0.425], [0.816, 0.489], [0.947, 0.581],
                   [1.000, 0.600]];

  function smoothProgress(u) {
    for (var i = 1; i < smoothPts.length; i++) {
      if (u <= smoothPts[i][0]) {
        var a = smoothPts[i - 1], b = smoothPts[i];
        return a[1] + (b[1] - a[1]) * (u - a[0]) / (b[0] - a[0]);
      }
    }
    return sixty;
  }
  function progress(el) {
    if (el <= fillStart) return 0;
    if (el < smoothEnd) return smoothProgress((el - fillStart) / (smoothEnd - fillStart));
    if (el < jumpEnd) {
      var u = (el - smoothEnd) / (jumpEnd - smoothEnd);
      var e = 1 - Math.pow(1 - u, 2);
      return sixty + e * (plateau - sixty);
    }
    if (el < freezeEnd) return plateau;
    var v = Math.min((el - freezeEnd) / (morphAt - freezeEnd), 1);
    return plateau + v * (0.80 - plateau);
  }
  function pauseOpacity(el) {
    if (el < fillStart - 0.20) return 0;
    if (el < fillStart) return (el - (fillStart - 0.20)) / 0.20;
    if (el < smoothEnd) return 1;
    if (el < smoothEnd + 0.10) return 1 - (el - smoothEnd) / 0.10;
    return 0;
  }
  function trackTrim(el) {
    if (el < spinEnd) return 0.79;
    if (el < fillStart) return 0.79 + ((el - spinEnd) / (fillStart - spinEnd)) * 0.21;
    return 1.0;
  }
  function trackRotation(el) { return Math.min(el, spinEnd) * spinSpeed; }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function easeInOut(x) { return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

  // cubic-bezier(.19,.05,.26,.95) — V3's disc→pill stretch curve
  function bez(p1x, p1y, p2x, p2y) {
    function sample(t, a, b) { // one coordinate of the curve
      var mt = 1 - t;
      return 3 * mt * mt * t * a + 3 * mt * t * t * b + t * t * t;
    }
    return function (x) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var t = x;
      for (var i = 0; i < 6; i++) {                    // Newton
        var cx = sample(t, p1x, p2x) - x;
        var dx = 3 * (1 - t) * (1 - t) * p1x + 6 * (1 - t) * t * (p2x - p1x) +
                 3 * t * t * (1 - p2x);
        if (Math.abs(dx) < 1e-6) break;
        t -= cx / dx;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
      }
      return sample(t, p1y, p2y);
    };
  }
  var morphEase = bez(0.19, 0.05, 0.26, 0.95);

  function setMorphRect(x, y, w, h) {
    morph.style.left = (x / CW * 100) + '%';
    morph.style.top = (y / CH * 100) + '%';
    morph.style.width = (w / CW * 100) + '%';
    morph.style.height = (h / CH * 100) + '%';
    morph.style.borderRadius = '999px';
  }
  // the sprite inside the morph window must render at the window's on-screen scale:
  // width in CSS px of 230 canvas-px = 230/1179 of stage width
  function sizeMorphImg() {
    var sw = document.getElementById('stage').clientWidth;
    var img = morph.querySelector('img');
    img.style.width = (230 / CW * sw) + 'px';
    img.style.height = 'auto';
  }
  window.addEventListener('resize', sizeMorphImg);

  var t0 = null, done = false;
  function start() {
    if (t0 !== null) return;
    t0 = performance.now();
    tap.style.display = 'none';
    patch.style.display = 'block';
    sizeMorphImg();
    requestAnimationFrame(tick);
  }

  function tick(now) {
    var el = (now - t0) / 1000;

    // 1. collapse (V3: pill exits scale .5 + fade; ring enters scale 1.6 + fade, 0.18s easeInOut)
    if (el < COLLAPSE) {
      var u = easeInOut(el / COLLAPSE);
      getspr.style.transform = 'scale(' + (1 - 0.5 * u) + ')';
      getspr.style.opacity = 1 - u;
      var s = 1.6 - 0.6 * u;
      ringg.setAttribute('transform',
        'translate(' + RCX + ' ' + RCY + ') scale(' + s + ') translate(' + (-RCX) + ' ' + (-RCY) + ')');
      ringg.setAttribute('opacity', u);
    } else {
      getspr.style.opacity = 0;
      ringg.removeAttribute('transform');
      if (el < morphAt) ringg.setAttribute('opacity', 1);
    }

    // 2. spinner track: gapped, rotating 350deg/s; gap closes 1.03->1.33
    if (el < morphAt) {
      var tr = trackTrim(el);
      track.setAttribute('stroke-dasharray', (tr * CIRC) + ' ' + CIRC);
      track.setAttribute('transform', 'rotate(' + (-90 + trackRotation(el)) + ' ' + RCX + ' ' + RCY + ')');
      var pr = progress(el);
      arc.setAttribute('visibility', pr > 0 ? 'visible' : 'hidden');
      arc.setAttribute('stroke-dasharray', (pr * CIRC) + ' ' + CIRC);
      bars.setAttribute('opacity', pauseOpacity(el));
    }

    // 3. morphAt: one-frame snap ring -> solid disc, then disc stretches into Open (0.217s bezier)
    if (el >= morphAt) {
      ringg.setAttribute('opacity', 0);
      var m = clamp01((el - morphAt) / MORPH_S);
      var e = morphEase(m);
      var w = 84 + (PILL.w - 84) * e;
      var h = 84 + (PILL.h - 84) * e;
      var x = (RCX - 42) + (PILL.x - (RCX - 42)) * e;
      var y = (RCY - 42) + (PILL.y - (RCY - 42)) * e;
      morph.style.display = 'block';
      setMorphRect(x, y, w, h);
      if (m >= 1 && !done) {
        done = true;
        morph.style.display = 'none';
        openfin.style.display = 'block';
        openA.style.display = 'block';
      }
    }
    if (!done) requestAnimationFrame(tick);
  }

  // tap: subtle press dim on the real pill sprite (visible over the identical bg pixels)
  tap.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    patch.style.display = 'block';
    getspr.style.opacity = 0.7;
  });
  tap.addEventListener('pointerup', function (e) {
    e.preventDefault();
    getspr.style.opacity = 1;
    start();
  });

  // freeze the world
  ['touchmove', 'gesturestart', 'gesturechange'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('touchend', function (e) {
    if (e.target !== openA && e.target !== tap) e.preventDefault();
  }, { passive: false });

  // hidden door to the link-test page: triple-tap the top-left corner within 1.2s
  var diagTaps = [];
  document.getElementById('diag').addEventListener('pointerup', function () {
    var now = performance.now();
    diagTaps = diagTaps.filter(function (t) { return now - t < 1200; });
    diagTaps.push(now);
    if (diagTaps.length >= 3) location.href = 't.html';
  });

  window.__dbg = { start: start, tick: tick, setT0: function (v) { t0 = v; },
                   getT0: function () { return t0; } };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
